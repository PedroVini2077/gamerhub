# Portão de qualidade automático.
#
# Por que existe: até agora `build`, `lint` e `test` rodavam porque EU lembrava
# de rodar antes de abrir o PR. Funcionou até hoje. CI não esquece nunca — e a
# definição de pronto do CLAUDE.md §2 passa a ser verificada por máquina, não
# por disciplina.
#
# O job `qualidade` NÃO precisa de segredo nenhum: o build do Vite compila sem
# as variáveis do Supabase (elas só fazem falta em runtime, e o guard de
# `lib/supabase.js` já mostra uma tela explicando quando faltam).
#
# O job `fumaca` precisa alcançar o Supabase de verdade, então só roda quando
# as duas variáveis existirem no repositório. Para ligá-lo:
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable
#     VITE_SUPABASE_URL       = https://<projeto>.supabase.co
#     VITE_SUPABASE_ANON_KEY  = <a anon key>
# São *variables*, não *secrets*: a anon key é pública por natureza — é a mesma
# que o site entrega a qualquer visitante.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR novo cancela a execução anterior do mesmo PR — economiza minuto de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: build · lint · testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # package-lock, sem atualizar nada por conta própria.
      - run: npm ci

      # A ordem importa: lint e teste primeiro porque falham rápido e apontam
      # o problema com precisão; o build é o mais lento e o menos específico.
      - name: Lint (0 erros; warnings não podem aumentar)
        run: npm run lint

      - name: Testes unitários
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json

      # O CI quebrando é o caso FÁCIL: fica vermelho e alguém olha.
      # O caso perigoso é o contrário — o CI passar sem testar nada. Um arquivo
      # de teste renomeado para fora do padrão, um `describe.skip` esquecido, um
      # glob de config alterado: o `vitest` sai com 0 e o PR fica verde.
      # Seria a mesma falha silenciosa que a §1.5 combate, só que na ferramenta
      # que deveria pegá-la. O piso abaixo torna isso impossível.
      #
      # Ao ADICIONAR testes, suba o piso junto. Ao remover, é para doer mesmo:
      # perder cobertura tem que ser decisão consciente, não acidente.
      - name: Guarda — a suíte não pode encolher em silêncio
        run: |
          total=$(node -p "require('./vitest-report.json').numTotalTests")
          piso=181
          echo "testes executados: $total (piso: $piso)"
          if [ "$total" -lt "$piso" ]; then
            echo "::error::A suite caiu para $total testes, abaixo do piso de $piso."
            echo "::error::Ou algum arquivo de teste parou de ser encontrado, ou houve remocao."
            echo "::error::Se a remocao foi proposital, abaixe o piso em .github/workflows/ci.yml no mesmo PR."
            exit 1
          fi

      - name: Build
        run: npm run build

      # O CI barrava build quebrado, lint, teste, rota fora do ar e PR sem
      # documentação — mas não barrava o site ficar mais pesado. Dava para
      # mergear algo que dobrasse o JavaScript inicial e ninguém ficaria sabendo
      # até abrir o PageSpeed por conta própria.
      #
      # Mede BYTES, não tempo, de propósito: tempo de laboratório oscila com a
      # máquina do runner (as duas medições de 27/08 discordaram 4× no TBT
      # medindo o mesmo site), e portão que balança vira alarme falso. O
      # raciocínio completo está no cabeçalho do script.
      - name: Orçamento de bytes do carregamento
        run: node scripts/orcamento-de-bytes.mjs

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      # Job que se pula sozinho e verde que nao testou nada (§1.5). Enquanto a
      # conta de staff nao existir, o painel de admin segue SEM cobertura de
      # navegador — e isso tem que aparecer em algum lugar, nem que seja como
      # aviso amarelo no resumo do PR.
      - name: Avisar se o painel de admin está sem cobertura
        env:
          # O contexto `secrets` NAO funciona em `if:` — so em `env`, `with` e
          # `run`. Por isso o secret entra como variavel e o teste e feito no
          # shell. Escrever `if: secrets.X == ''` daria um portao que nunca
          # dispara, que e pior que portao nenhum.
          TEM_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          TEM_SENHA: ${{ secrets.E2E_STAFF_PASSWORD }}
        run: |
          if [ -z "$TEM_EMAIL" ] || [ -z "$TEM_SENHA" ]; then
            echo "::warning::O painel /admin nao tem cobertura de navegador: os secrets E2E_STAFF_EMAIL e E2E_STAFF_PASSWORD nao estao configurados. Ver o job 'painel de admin num navegador'."
          else
            echo "Secrets da conta de staff presentes — o painel tem cobertura."
          fi

  documentacao:
    name: documentação acompanhou o código
    runs-on: ubuntu-latest
    # Só em PR: um push direto na main não tem "antes e depois" para comparar.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Precisa do histórico para comparar com a base do PR.
          fetch-depth: 0

      # A regra do CLAUDE.md §2 ("README atualizado se mudou comportamento")
      # existia e mesmo assim foi esquecida — o README ficou sem saber de
      # Sentry, CI, detecção de banco fora do ar e metade da moderação. Regra
      # escrita não bastou; isto é a trava.
      - name: PR que muda o produto precisa tocar documentação
        run: |
          base="origin/${{ github.base_ref }}"
          mudou=$(git diff --name-only "$base"...HEAD)
          echo "Arquivos no PR:"; echo "$mudou" | sed 's/^/  /'

          # `supabase/` cobre Edge Functions; `db/` cobre SQL versionado.
          produto=$(echo "$mudou" | grep -E '^(src/|db/|supabase/)' | grep -v '__tests__' || true)
          docs=$(echo "$mudou" | grep -E '^(README\.md|BACKLOG\.md|CLAUDE\.md|docs/)' || true)

          if [ -n "$produto" ] && [ -z "$docs" ]; then
            echo "::error::Este PR muda o produto e não toca em nenhuma documentação."
            echo "::error::Atualize o que mudou de comportamento (docs/), o que falta (BACKLOG.md)"
            echo "::error::ou o que foi decidido (docs/DECISOES.md) — no MESMO PR."
            echo "::error::Se a mudança realmente não afeta nada disso, toque o arquivo"
            echo "::error::relevante dizendo por que não afeta. Silêncio não é resposta."
            exit 1
          fi
          echo "OK — documentação acompanhou (ou o PR não mexe no produto)."

  deploys:
    name: a branch não gasta deploy da Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # Em 23/08/2026 batemos no teto do plano Free (100 deploys/dia) com 3
      # usuários no site. A causa não foi mergear demais: a Vercel constrói a
      # cada push em QUALQUER branch, e o ciclo de trabalho aqui empurra a
      # branch 3-5 vezes por PR — incluindo o `--force-with-lease` que realinha
      # a branch com um conteúdo IDÊNTICO ao que acabou de ir pra main.
      #
      # `vercel.json` desliga isso por nome de branch, e nome de branch muda.
      # Esta trava existe porque a regra escrita já falhou antes (§2): sem
      # portão, a próxima branch nasce gastando deploy e ninguém percebe até o
      # dia em que o site não sobe.
      - name: A branch deste PR está desligada na Vercel
        run: |
          node -e '
            const fs = require("fs");
            const ref = process.env.HEAD_REF;
            const cfg = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
            const mapa = cfg.git?.deploymentEnabled ?? {};

            if (mapa[ref] !== false) {
              console.log(`::error::A branch "${ref}" nao esta desligada em vercel.json.`);
              console.log("::error::Cada push nela cria um deploy de preview que ninguem olha —");
              console.log("::error::quem revisa branch aqui e o CI, nao o preview.");
              console.log("::error::Acrescente em vercel.json, dentro de git.deploymentEnabled:");
              console.log(`::error::    "${ref}": false`);
              process.exit(1);
            }

            if (!fs.existsSync("scripts/vercel-ignore.sh")) {
              console.log("::error::vercel.json aponta ignoreCommand para scripts/vercel-ignore.sh,");
              console.log("::error::que nao existe. A Vercel trata erro como \"construa\" — ou seja,");
              console.log("::error::voltaria a construir TUDO, e em silencio.");
              process.exit(1);
            }
            console.log(`OK — "${ref}" desligada, e o ignoreCommand aponta para um script que existe.`);
          '
        env:
          HEAD_REF: ${{ github.head_ref }}

  fumaca:
    name: rotas num navegador de verdade
    runs-on: ubuntu-latest
    needs: qualidade
    # Sem as variáveis o site não alcança o Supabase e o teste acusaria "0/12
    # rotas" — falha que não diz nada sobre o código. Melhor não rodar do que
    # rodar mentindo.
    if: vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_ANON_KEY != ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build com as variáveis do site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # `--host 127.0.0.1` fixa o endereço que o smoke test procura, e o
      # `curl --retry` espera o servidor subir em vez de dormir um tempo fixo.
      - name: Subir o preview e esperar responder
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent \
               --output /dev/null http://127.0.0.1:4173

      - name: Teste de fumaça das rotas
        run: npm run test:e2e
        env:
          SMOKE_BASE: http://127.0.0.1:4173

      # Trava das brechas de 23/08. Não precisa de navegador nem de build — só
      # de rede — mas mora aqui porque depende da mesma variável, e porque este
      # job já é o que "fala com o Supabase de verdade".
      #
      # Por que bate na produção em vez de ler o código: as Edge Functions não
      # estão no git. Um teste que varre `src/` não protege nada delas — basta
      # um deploy pelo dashboard e a porta reabre sem que o repositório mude.
      # Nenhuma das requisições tem efeito colateral: todas devem ser recusadas.
      - name: As portas das Edge Functions continuam fechadas
        run: npm run test:portas
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}

  fluxos:
    name: fluxos autenticados
    runs-on: ubuntu-latest
    needs: qualidade
    # Precisa das variáveis do site E das credenciais da conta de teste.
    # As credenciais são *secrets* (senha é segredo, ao contrário da anon key):
    #   Settings -> Secrets and variables -> Actions -> Secrets -> New secret
    #     E2E_EMAIL     = a conta descartável
    #     E2E_PASSWORD  = a senha dela
    # A conta tem que ser `role = 'user'`: o teste confere justamente que ela
    # NÃO enxerga /admin nem /owner.
    if: >-
      vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_ANON_KEY != ''
      && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build com as variáveis do site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Subir o preview e esperar responder
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent \
               --output /dev/null http://127.0.0.1:4173

      # Sem credencial o script sai com 2 e este passo falha de propósito: um
      # secret que sumiu tem que APARECER, não virar "job pulado em silêncio"
      # (§1.5). Só em PR porque o teste escreve no banco de produção (publica e
      # apaga um post) — rodar de novo no push da main duplicaria isso sem
      # cobrir nada novo.
      - name: Login, rotas internas, publicar e apagar
        run: npm run test:e2e:fluxos
        env:
          SMOKE_BASE: http://127.0.0.1:4173
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Sem isto, uma falha no CI só diz "timeout" e não dá para diagnosticar
      # sem reproduzir na mão.
      - name: Guardar a evidência da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidencia
          path: e2e-evidencia/
          if-no-files-found: ignore
          retention-days: 7

  painel:
    name: painel de admin num navegador
    runs-on: ubuntu-latest
    needs: qualidade
    # Segunda conta de teste, com cargo `admin`. Ela existe porque a do
    # `fluxos` é `role = 'user'` DE PROPÓSITO — é assim que aquele job prova
    # que /admin e /owner sao negados. Promover aquela conta destruiria a prova,
    # entao o painel so ganha cobertura de navegador com uma conta separada.
    #   Settings -> Secrets and variables -> Actions -> Secrets:
    #     E2E_STAFF_EMAIL     = a conta de staff
    #     E2E_STAFF_PASSWORD  = a senha dela
    #
    # O `secrets.E2E_STAFF_EMAIL != ''` no `if` e deliberado e tem prazo: ate a
    # conta existir, este job nao roda em vez de falhar em todo PR. Assim que os
    # secrets forem criados, ele passa a rodar sozinho. NAO deixar assim para
    # sempre — job que se pula sozinho e verde que nao testou nada (§1.5); o
    # aviso abaixo existe justamente para isso nao passar despercebido.
    if: >-
      vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_ANON_KEY != ''
      && github.event_name == 'pull_request'
    steps:
      # `secrets` nao existe em `if:`, entao a checagem vive num passo. Enquanto
      # a conta nao existir, o job termina verde com AVISO em vez de reprovar
      # todo PR — mas o aviso do job `qualidade` garante que isso nao passe
      # despercebido (§1.5).
      - name: A conta de staff já existe?
        id: conta
        env:
          EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          SENHA: ${{ secrets.E2E_STAFF_PASSWORD }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$SENHA" ]; then
            echo "::warning::Sem E2E_STAFF_EMAIL/E2E_STAFF_PASSWORD — o painel de admin nao sera testado."
            echo "rodar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.conta.outputs.rodar == 'sim'

      - uses: actions/setup-node@v7
        if: steps.conta.outputs.rodar == 'sim'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.conta.outputs.rodar == 'sim'

      - name: Instalar o Chromium do Playwright
        if: steps.conta.outputs.rodar == 'sim'
        run: npx playwright install --with-deps chromium

      - name: Build com as variáveis do site
        if: steps.conta.outputs.rodar == 'sim'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Subir o preview e esperar responder
        if: steps.conta.outputs.rodar == 'sim'
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent \
               --output /dev/null http://127.0.0.1:4173

      # Somente leitura: abre o painel e cada aba, e confere que `admin` NAO
      # alcanca o /owner. Nenhuma acao destrutiva — uma conta de staff
      # automatizada ocultando post ou suspendendo gente em todo PR deixaria
      # estrago em dado real. Isso continua validado em ROLLBACK (db/*.md).
      - name: Abrir o painel, as abas, e conferir a hierarquia
        if: steps.conta.outputs.rodar == 'sim'
        run: npm run test:e2e:painel
        env:
          SMOKE_BASE: http://127.0.0.1:4173
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}

      - name: Guardar a evidência da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: painel-evidencia
          path: e2e-evidencia/
          if-no-files-found: ignore
          retention-days: 7
