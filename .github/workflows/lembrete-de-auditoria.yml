# Lembrete de auditoria completa.
#
# ── Por que existe ──────────────────────────────────────────────────────────
#
# A auditoria em 4 fases (CLAUDE.md §6) é a única coisa grande que continua
# dependendo do dono pedir — ela consome uma sessão inteira, então quem decide a
# hora é quem paga o token. O problema não é a decisão, é a LEMBRANÇA: nas
# palavras dele, *"às vezes nós fazemos muitas coisas, e eu vou esquecer que
# isso existe"*.
#
# Regra que depende de alguém lembrar é regra que uma hora não roda. Este robô
# tira a lembrança da cabeça dele e coloca num lugar que não esquece.
#
# ── Por que DOIS gatilhos, e não só uma data ────────────────────────────────
#
# A primeira versão disparava só por tempo, em 90 dias. Estava errado, e o dono
# desconfiou antes de mim. A conta que mostra: em 5 dias desde a última
# auditoria entraram **31 commits** e **51 arquivos de `src/` tocados** — em 90
# dias isso viraria centenas de mudanças sem ninguém revisar o conjunto.
#
# O que envelhece uma auditoria não é o calendário, é a MUDANÇA. Por isso agora
# dispara no que vier primeiro:
#
#   * 60 dias desde o último relatório, ou
#   * 120 commits na main desde a data dele.
#
# Os dois números foram calibrados no ritmo real do projeto: 71 commits nos
# últimos 30 dias, ou seja ~120 commits ≈ 7 a 8 semanas de trabalho normal. Os
# dois gatilhos concordam no ritmo comum, e o de commits chega antes quando o
# projeto entra numa semana intensa — que é exatamente quando a auditoria fica
# mais necessária.
#
# ── Por que issue, e não email ou comentário em PR ──────────────────────────
#
# Issue FICA. Email some na caixa de entrada, comentário some no histórico do
# PR. E como ele confere se já existe uma aberta antes de criar, não vira
# enxurrada semanal — alarme repetido ensina a ignorar o canal (§0.2).
#
# ── O que ele NÃO faz ───────────────────────────────────────────────────────
#
# Não roda auditoria, não reprova nada, não cobra. Só avisa que passou do ponto.
# A decisão de rodar continua inteira com o dono.

name: Lembrete de auditoria

on:
  schedule:
    # Toda segunda, 12:00 UTC (09:00 em Brasília). Semanal, e não mensal, para
    # o gatilho de commits ser responsivo — a dedupe abaixo impede que isso
    # vire uma issue por semana.
    - cron: '0 12 * * 1'
  workflow_dispatch:   # para testar sem esperar a segunda

permissions:
  issues: write
  contents: read

env:
  DIAS_LIMITE: 60
  COMMITS_LIMITE: 120

jobs:
  lembrar:
    name: passou do ponto de auditoria?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # precisa do histórico inteiro para contar commits

      # A verdade sobre a última auditoria não é uma data escrita à mão em lugar
      # nenhum: é o relatório mais recente em db/AAAA-MM-DD-*.md, que a §6 manda
      # criar ao fim de uma. Ler dali significa que o lembrete não tem como
      # divergir do que de fato aconteceu (§1.4).
      - name: Medir o que passou desde a última auditoria
        id: medir
        run: |
          set -euo pipefail

          arquivo=$(ls db/*.md 2>/dev/null | grep -E 'db/[0-9]{4}-[0-9]{2}-[0-9]{2}-' | sort | tail -1 || true)

          if [ -z "$arquivo" ]; then
            echo "::warning::Nenhum relatório de auditoria em db/. Tratando como muito atrasado."
            {
              echo "disparar=sim"; echo "data=nenhuma"; echo "dias=?"; echo "commits=?"
              echo "motivo=não existe nenhum relatório de auditoria em \`db/\`"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          data=$(basename "$arquivo" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')
          dias=$(( ( $(date +%s) - $(date -d "$data" +%s) ) / 86400 ))
          commits=$(git rev-list --count --since="$data" origin/main)

          echo "última auditoria: $data ($arquivo)"
          echo "  $dias dias atrás (limite: ${DIAS_LIMITE})"
          echo "  $commits commits na main desde então (limite: ${COMMITS_LIMITE})"

          motivo=""
          [ "$dias"    -gt "$DIAS_LIMITE" ]    && motivo="passaram **$dias dias** (o limite é ${DIAS_LIMITE})"
          if [ "$commits" -gt "$COMMITS_LIMITE" ]; then
            [ -n "$motivo" ] && motivo="$motivo, e entraram **$commits commits** (o limite é ${COMMITS_LIMITE})" \
                             || motivo="entraram **$commits commits** na main (o limite é ${COMMITS_LIMITE})"
          fi

          {
            echo "disparar=$([ -n "$motivo" ] && echo sim || echo nao)"
            echo "data=$data"; echo "dias=$dias"; echo "commits=$commits"
            echo "motivo=$motivo"
          } >> "$GITHUB_OUTPUT"

      - name: Abrir issue
        if: steps.medir.outputs.disparar == 'sim'
        uses: actions/github-script@v7
        env:
          DATA: ${{ steps.medir.outputs.data }}
          DIAS: ${{ steps.medir.outputs.dias }}
          COMMITS: ${{ steps.medir.outputs.commits }}
          MOTIVO: ${{ steps.medir.outputs.motivo }}
        with:
          script: |
            const TITULO = 'Está na hora de uma auditoria completa do projeto';

            // Já existe uma aberta? Então o lembrete já foi dado. Abrir outra
            // toda semana transformaria o aviso em ruído.
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auditoria',
            });
            if (abertas.data.some(i => i.title === TITULO)) {
              core.info('Já existe uma issue de lembrete aberta. Nada a fazer.');
              return;
            }

            const { DATA, DIAS, COMMITS, MOTIVO } = process.env;
            const corpo = [
              `Desde a última auditoria (**${DATA}**), ${MOTIVO}.`,
              '',
              `| | |`,
              `| --- | --- |`,
              `| Último relatório | ${DATA} |`,
              `| Dias desde então | ${DIAS} |`,
              `| Commits na main desde então | ${COMMITS} |`,
              '',
              'Isto é um lembrete, não uma cobrança. A auditoria consome uma sessão',
              'inteira, então a hora de rodar continua sendo decisão sua.',
              '',
              '## O que ela cobre (`CLAUDE.md` §6)',
              '',
              '| Fase | O que olha |',
              '| --- | --- |',
              '| 0 | Inventário — a lista fechada do que precisa ser lido |',
              '| 1 | Frontend — hooks, vazamento, corrida, XSS, acessibilidade |',
              '| 2 | Backend — corpo de toda função `SECURITY DEFINER` |',
              '| 3 | Banco — RLS, policies por comando, índices, FKs, advisors |',
              '| 4 | **Deriva** entre o código e o banco — a fase que pega o bug que não estoura em lugar nenhum |',
              '',
              '## Como começar',
              '',
              'Basta dizer "vamos fazer a auditoria" numa sessão. Eu começo pela Fase 0,',
              'relato ao fim de cada fase e espero antes de seguir.',
              '',
              '---',
              '',
              '*Aberta automaticamente por `.github/workflows/lembrete-de-auditoria.yml`.',
              'Fechar esta issue silencia o lembrete até o próximo relatório entrar em',
              '`db/AAAA-MM-DD-*.md`.*',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: TITULO, body: corpo, labels: ['auditoria'],
            });
            core.info('Issue de lembrete criada.');
