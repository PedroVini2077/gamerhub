# ============================================================================
# `[17/09]` Implantar as Edge Functions — e PROVAR que foram implantadas
# ============================================================================
#
# ── O buraco que este workflow fecha ────────────────────────────────────────
#
# Até 17/09 a implantação dependia de eu **retranscrever ~2.100 linhas** de
# código de produção numa chamada de ferramenta. Numa função como a
# `send-email`, um caractere perdido derruba o cadastro — então eu parei, e o
# resultado foi **7 das 8 funções rodando versão velha por dias**, com as duas
# correções da `send-email` mortas enquanto a documentação as descrevia vivas.
#
# Com o token no cofre do repositório, o CI implanta **do disco**. Nada passa
# por transcrição, nem pelo chat.
#
# ── Por que ele NÃO roda a cada push ────────────────────────────────────────
#
# Só em `main`, e só quando a pasta das funções (ou a configuração delas) muda.
# Dois motivos: implantar código de branch em produção é o oposto do que a
# `claude/*` existe para evitar, e implantação é uma ação com efeito externo —
# ela não deve acontecer por acidente de caminho.
#
# ── A parte que importa: o passo que PROVA ──────────────────────────────────
#
# `Deployed Functions.` é o que a CLI diz quando o upload termina. Isso **não**
# é prova de que a função no ar é esta — foi exatamente essa confusão que
# deixou as correções mortas por dias.
#
# Por isso o último passo pergunta a impressão a cada função **no ar** e compara
# com a do repositório (`npm run edges`). Se divergir, o job **reprova** — e aí
# a falha é alta em vez de muda (§1.5).
# ============================================================================
name: implantar Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/implantar-edges.yml'
  workflow_dispatch:

# Só leitura: este workflow não escreve no repositório.
permissions:
  contents: read

# Duas implantações ao mesmo tempo disputariam a mesma função. A da frente
# espera; a do meio da fila é descartada, porque o que vale é o último commit.
concurrency:
  group: implantar-edges
  cancel-in-progress: false

jobs:
  implantar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: yuqbdcoljlvncxdnesxk

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Sem o segredo, o `deploy` falharia com uma mensagem de autenticação que
      # não explica nada. Falhar aqui, dizendo o nome exato e onde criá-lo, é a
      # diferença entre um erro que ensina e um que manda procurar.
      - name: o segredo existe?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN."
            echo "Crie em: Settings -> Secrets and variables -> Actions ->"
            echo "  New repository secret, com o nome EXATO SUPABASE_ACCESS_TOKEN."
            echo "O passo a passo completo esta em docs/OPERACAO.md."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `deploy` sem nome implanta todas. A configuração de `verify_jwt` de cada
      # uma vem do `supabase/config.toml` — versionada, e não de uma flag que
      # alguem precisa lembrar de digitar. Ver o cabecalho daquele arquivo.
      - name: implantar todas
        run: supabase functions deploy --project-ref "$PROJETO"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # O passo que separa "subiu" de "está no ar". Pergunta a impressão a cada
      # função viva e compara com a do repositorio.
      - name: provar que o que esta no ar veio deste codigo
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run edges
