<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão — GamerHub</title>
    <style>
      /*
        Esta página é servida pelo service worker quando a rede falha, e por
        isso ela não pode depender de NADA: nem do bundle, nem de fonte
        externa, nem de folha de estilo separada. Se dependesse, a tela de
        "você está offline" seria a primeira coisa a quebrar offline.

        A fonte é a da pilha do sistema de propósito. A `Orbitron` do site mora
        em `public/fonts/`, e cacheá-la aqui exigiria entrar no cache do worker
        — o que a Fase 1 não faz, porque o nome dela não carrega hash.
      */
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060608;
        color: #e5e7eb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 420px; }
      .marca {
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #39ff14;
        margin: 0 0 24px;
      }
      h1 { font-size: 22px; line-height: 1.3; margin: 0 0 12px; color: #fff; }
      p { font-size: 14px; line-height: 1.7; color: #9ca3af; margin: 0 0 28px; }
      button {
        font: inherit;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #39ff14;
        background: transparent;
        border: 1px solid rgba(57, 255, 20, 0.4);
        border-radius: 10px;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:hover, button:focus-visible {
        background: rgba(57, 255, 20, 0.08);
        border-color: #39ff14;
      }
      .dica { font-size: 12px; color: #6b7280; margin-top: 24px; }
    </style>
  </head>
  <body>
    <main>
      <p class="marca">GamerHub</p>
      <h1>Você está sem conexão</h1>
      <p>
        O GamerHub precisa de internet para carregar o feed, as lives e o seu
        perfil. Assim que a conexão voltar, é só tentar de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
      <p class="dica">Esta tela veio do seu aparelho, não da internet.</p>
    </main>
  </body>
</html>
