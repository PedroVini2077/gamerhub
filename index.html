<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060608" />

    <title>GamerHub — a comunidade gamer brasileira</title>
    <meta name="description" content="Rede social gamer brasileira: feed de dicas, curiosidades e news, mural da comunidade, lives com chat ao vivo, keys grátis e sistema de ranks por XP." />

    <!-- Prévia ao compartilhar o link (WhatsApp, Discord, X). Sem isso o link
         do site aparecia sem título nem descrição. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GamerHub" />
    <meta property="og:title" content="GamerHub — a comunidade gamer brasileira" />
    <meta property="og:description" content="Feed, mural, lives com chat ao vivo, keys grátis e ranks por XP. Entra no Hub." />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GamerHub — a comunidade gamer brasileira" />
    <meta name="twitter:description" content="Feed, mural, lives com chat ao vivo, keys grátis e ranks por XP. Entra no Hub." />

    <!-- Fontes: pré-conectar corta o round-trip de handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- O CSS das fontes fica AQUI, e não num `@import` dentro do index.css.
         Duas razões, as duas medidas pelo Lighthouse em 27/08:

         1. Dentro do CSS, o navegador só descobre que precisa das fontes
            depois de baixar e parsear o bundle de estilo inteiro — cadeia
            serial de 1.126 ms. Aqui a busca começa junto com todo o resto.
         2. Folha de estilo é render-blocking por padrão: eram ~819 ms de tela
            branca esperando um recurso de terceiro. O par
            `media="print"` + `onload="this.media='all'"` é o padrão
            consagrado para carregar sem bloquear a primeira pintura.

         O custo dessa escolha é honesto: o texto aparece por um instante na
         fonte de sistema antes de trocar para Orbitron/Rajdhani. A URL já
         usa `display=swap`, então esse comportamento já existia para os
         arquivos de fonte — agora vale para o CSS também.

         O `<noscript>` garante a fonte para quem desliga JavaScript, já que
         o `onload` não roda nesse caso. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
