<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `[11/09]` Os ícones da marca nova. Todos saem de `src/lib/marca.js`
         por `npm run icones` — nenhum é editado à mão, então o favicon não
         tem como divergir da marca que o site desenha. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060608" />

    <title>GamerHub — a comunidade gamer brasileira</title>
    <meta name="description" content="Rede social gamer brasileira: feed de dicas, curiosidades e news, mural da comunidade, lives com chat ao vivo, keys grátis e sistema de ranks por XP." />

    <!-- Prévia ao compartilhar o link (WhatsApp, Discord, X). Sem isso o link
         do site aparecia sem título nem descrição. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GamerHub" />
    <meta property="og:title" content="GamerHub — a comunidade gamer brasileira" />
    <meta property="og:description" content="Feed, mural, lives com chat ao vivo, keys grátis e ranks por XP. Entra no Hub." />
    <meta property="og:locale" content="pt_BR" />
    <!-- `[11/09]` O cartão de compartilhamento. Ele NÃO existia: link do site
         colado no WhatsApp ou no Discord vinha sem imagem nenhuma. Gerado da
         mesma fonte da marca por `npm run icones` — não é editado à mão.
         A URL é ABSOLUTA de propósito: WhatsApp, Discord e Twitter buscam a
         imagem do servidor deles, sem página nenhuma aberta, e caminho
         relativo não resolve nesse contexto.
         JPEG e não WebP: o rastreador do Facebook ainda falha com WebP em
         parte dos casos, e a falha é MUDA — o link volta a aparecer sem
         imagem. Ver o comentário em `scripts/gerar-icones.mjs`. -->
    <meta property="og:image" content="https://gamerhub-nine.vercel.app/cartao-1200x630.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A marca do GamerHub" />
    <!-- `summary_large_image` e não `summary`: com imagem de 1200x630, o
         `summary` a recortaria num quadradinho ao lado do texto. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GamerHub — a comunidade gamer brasileira" />
    <meta name="twitter:description" content="Feed, mural, lives com chat ao vivo, keys grátis e ranks por XP. Entra no Hub." />

    <!-- `[03/09]` As fontes saíram do Google e passaram a ser servidas daqui.
         O `@font-face` está no `src/index.css`, com o porquê inteiro.

         Sumiu com tudo que existia aqui: os dois `preconnect`, o `preload`, o
         truque `media="print" + onload` e o `<noscript>` que existia porque o
         truque depende de JavaScript. Nada disso é necessário quando o arquivo
         mora no mesmo domínio — não há handshake com terceiro para adiantar,
         nem folha de estilo externa bloqueando a primeira pintura.

         O `preload` abaixo é de OUTRA natureza: ele não busca um CSS que
         revela outra URL, busca o arquivo final. É a fonte do corpo do texto,
         a única que aparece em toda tela; as outras entram sob demanda. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/rajdhani-400.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
